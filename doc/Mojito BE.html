      function PopupFrame({ title, children, label }) {
        return (
          <div
            className="pp-frame"
            data-screen-label={label}
          >
            <div className="pp-chrome">
              <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>

                  size={18}

      function useStore() {
        const [phase, setPhase] = useState('onboarding') // onboarding | locked | app
        const [onbStack, setOnbStack] = useState(['welcome'])
        const [flow, setFlow] = useState('create')
        const [accounts, setAccounts] = useState(BE_ACCOUNTS)
        const [accountId, setAccountId] = useState('a1')
        const [assets, setAssets] = useState(BE_ASSETS)
        const [nfts, setNfts] = useState(BE_NFTS)
        const [activity, setActivity] = useState(BE_ACTIVITY)
        const [sites, setSites] = useState(BE_SITES)
        const [network, setNetwork] = useState('Mainnet')
        const [hideBal, setHideBal] = useState(false)
        const [autoLock, setAutoLock] = useState('15 min')
        const [currency, setCurrency] = useState('USD')
        const [pwEveryTx, setPwEveryTx] = useState(true)
        const [showHex, setShowHex] = useState(false)
        const cols = [
          'var(--amber)',
          'var(--teal)',
          'var(--violet)',
          'var(--green)',
          'oklch(0.7 0.13 230)',
        ]
        const s = {
          phase,
          setPhase,
          locked: phase === 'locked',
          accounts,
          account: accounts.find((a) => a.id === accountId) || accounts[0],
          assets,
          nfts,
          activity,
          sites,
          network,
          hideBal,
          autoLock,
          currency,
          pwEveryTx,
          showHex,
          setAccount: setAccountId,
          setNetwork,
          setHideBal,
          setAutoLock,
          setCurrency,
          setPwEveryTx,
          setShowHex,
          lock: () => setPhase('locked'),
          unlock: () => setPhase('app'),
          reset: () => {
            setPhase('onboarding')
            setOnbStack(['welcome'])
          },
          addAccount: () =>
            setAccounts((a) => [
              ...a,
              {
                id: 'a' + (a.length + 1),
                name: 'Account ' + (a.length + 1),
                color: cols[a.length % cols.length],
                btc:
                  'bc1q' + Math.random().toString(36).slice(2).padEnd(38, 'x'),
                ml:
                  'mtc1q' + Math.random().toString(36).slice(2).padEnd(38, 'x'),
              },
            ]),
          renameAccount: (id, name) =>
            setAccounts((a) =>
              a.map((x) => (x.id === id ? { ...x, name } : x)),
            ),
          toggleHidden: (id) =>
            setAssets((a) =>
              a.map((x) => (x.id === id ? { ...x, hidden: !x.hidden } : x)),
            ),
          addToken: (t) =>
            setAssets((a) =>
              a.some((x) => x.tokenId === t.tokenId)
                ? a

                    ...a,
                    {
                      id: t.tokenId,
                      sym: t.ticker,
                      name: t.ticker,
                      chain: 'Mintlayer',
                      amount: 0,
                      price: 0,
                      change: 0,
                      spark: [1, 1, 1, 1, 1, 1, 1, 1, 1],
                      decimals: t.decimals,
                      tokenId: t.tokenId,
                      supply: t.supply,
                      ticker: t.ticker,

            setAssets((a) =>
              a.map((x) =>

                      id={o.id}

                      nav={nav}
                    />
                  )}

                      nav={nav}
                      page={o.page}

          if (req) setOpen(false)
        }, [req])
        if (!open)
          return (
            <button
              className="dev mini"
              onClick={() => setOpen(true)}
            >
              ⚙ demo
            </button>
          )
        const Row = ({ label, children }) => (
          <div style={{ marginTop: 12 }}>
            <div
              className="eyebrow"
              style={{ fontSize: 9, marginBottom: 5 }}
            >
              {label}
            </div>
            {children}
          </div>
        )
        const Btn = ({ on, onClick, children }) => (
          <button
            className={'dev-jump' + (on ? ' cur' : '')}
            onClick={onClick}
          >
            {children}
          </button>
        )
        return (
          <div className="dev">
            <div
              style={{
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'space-between',
              }}
            >
              <span style={{ font: '700 11px Inter', letterSpacing: '0.02em' }}>
                Demo controls
              </span>
              <button
                onClick={() => setOpen(false)}
                style={{
                  background: 'transparent',
                  border: 'none',
                  color: 'var(--text-3)',
                  cursor: 'pointer',
                  fontSize: 13,
                }}
              >
                ×
              </button>
            </div>
            <Row label="Wallet state">
              <div
                style={{
                  display: 'grid',
                  gridTemplateColumns: '1fr 1fr',
                  gap: 4,
                }}
              >
                <Btn
                  on={s.phase === 'onboarding' && s.onb.screen === 'welcome'}
                  onClick={() => {
                    s.setPhase('onboarding')
                    s.onb.jump('welcome')
                  }}
                >
                  Onboarding
                </Btn>
                <Btn
                  on={s.phase === 'onboarding' && s.onb.screen === 'seed'}
                  onClick={() => {
                    s.setPhase('onboarding')
                    s.onb.setFlow('create')
                    s.onb.jump('seed')
                  }}
                >
                  Seed reveal
                </Btn>
                <Btn
                  on={s.phase === 'onboarding' && s.onb.screen === 'import'}
                  onClick={() => {
                    s.setPhase('onboarding')
                    s.onb.setFlow('import')
                    s.onb.jump('import')
                  }}
                >
                  Import
                </Btn>
                <Btn
                  on={s.phase === 'locked'}
                  onClick={s.lock}
                >
                  Locked
                </Btn>
                <Btn
                  on={s.phase === 'app'}
                  onClick={s.unlock}
                >
                  Wallet
                </Btn>
              </div>
            </Row>
            <Row label="dApp request (opens 2nd window)">
              <div
                style={{
                  display: 'grid',
                  gridTemplateColumns: '1fr 1fr',
                  gap: 4,
                }}
              >
                {[
                  ['connect', 'Connect'],
                  ['sign', 'Sign message'],
                  ['tx', 'ML transaction'],
                  ['btctx', 'BTC transaction'],
                  ['network', 'Switch network'],
                  ['token', 'Add token'],
                  ['delegate', 'Delegate ML'],
                ].map(([k, l]) => (
                  <Btn
                    key={k}
                    on={req?.key === k}
                    onClick={() => setReq({ key: k, ...BE_REQUESTS[k] })}
                  >
                    {l}
                  </Btn>
                ))}
              </div>
            </Row>
            <Row label="Options">
              <div style={{ display: 'flex', gap: 4 }}>
                <button
                  className="dev-seg"
                  style={{
                    flex: 1,
                    background: s.pwEveryTx
                      ? 'var(--amber-soft)'
                      : 'oklch(1 0 0 / .04)',
                    color: s.pwEveryTx ? 'var(--amber)' : 'var(--text-2)',
                    borderColor: s.pwEveryTx
                      ? 'oklch(.82 .16 70 / .4)'
                      : 'var(--line-soft)',
                  }}
                  onClick={() => s.setPwEveryTx(!s.pwEveryTx)}
                >
                  PW per tx
                </button>
                <button
                  className="dev-seg"
                  style={{
                    flex: 1,
                    background:
                      s.network === 'Testnet'
                        ? 'var(--amber-soft)'
                        : 'oklch(1 0 0 / .04)',
                    color:
                      s.network === 'Testnet'
                        ? 'var(--amber)'
                        : 'var(--text-2)',
                    borderColor:
                      s.network === 'Testnet'
                        ? 'oklch(.82 .16 70 / .4)'
                        : 'var(--line-soft)',
                  }}
                  onClick={() =>
                    s.setNetwork(
                      s.network === 'Testnet' ? 'Mainnet' : 'Testnet',
                    )
                  }
                >
                  Testnet
                </button>
              </div>
            </Row>
            {log.length > 0 && (
              <Row label="Provider log">
                <div
                  className="mono"
                  style={{
                    fontSize: 9,
                    color: 'var(--text-2)',
                    lineHeight: 1.7,
                  }}
                >
                  {log.slice(-4).map((l, i) => (
                    <div key={i}>{l}</div>
                  ))}
                </div>
              </Row>
            )}
            <div
              className="hint"
              style={{ marginTop: 12, fontSize: 9 }}
            >
              Demo password: any 4+ chars. Seed verify words: #4 anchor · #12
              bench · #20 cluster.
            </div>
          </div>
        )
      }

      function App() {
        const s = useStore()
        const [req, setReq] = useState(null)
        const [log, setLog] = useState([])
        const [scale, setScale] = useState(1)
        useEffect(() => {
          const f = () => setScale(Math.min(1, (window.innerHeight - 40) / 640))
          f()
          window.addEventListener('resize', f)
          return () => window.removeEventListener('resize', f)
        }, [])
        const done = (r) => {
          setLog((l) => [...l, `${req.origin} · ${req.kind} → ${r}`])
          setReq(null)
        }
        return (
          <div
            style={{
              minHeight: '100vh',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              gap: 28,
              padding: 20,
              background: '#0b0a09',
              boxSizing: 'border-box',
            }}
          >
            <div
              style={{
                display: 'flex',
                gap: 28,
                alignItems: 'center',
                zoom: scale,
              }}
            >
              <PopupFrame
                title="Mojito"
                label="Extension popup"
              >
                <WalletPopup s={s} />
              </PopupFrame>
              {req && (
                <div
                  style={{
                    animation: 'slide-up 260ms cubic-bezier(.2,1,.4,1) both',
                  }}
                >
                  <PopupFrame
                    title="Mojito — request"
                    label="dApp request window"
                  >
                    <DappWindow
                      key={req.key + req.origin}
                      s={s}
                      req={req}
                      onDone={done}
                    />
                  </PopupFrame>
                </div>
              )}
            </div>
            <DevPanel
              s={s}
              req={req}
              setReq={setReq}
              log={log}
            />
          </div>
        )
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
  </body>
</html>
